services:
  # ---------- Database (PostgreSQL) ----------
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Backend (Spring Boot) ----------
  backend:
    build: ./backend-springboot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped

  # ---------- Frontend (React + nginx) ----------
  frontend:
    build: ./frontend-reactjs
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: unless-stopped

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
